{% extends "base.html" %}

{% block title %}Usuário{% endblock %}

{% block content %}

<section>
    <h1>Dados do usuário</h1>

    <p><strong>ID:</strong> {{ id_usuario }}</p>
    <p><strong>Nome:</strong> {{ usuario.nome }}</p>
    <p><strong>E-mail:</strong> {{ usuario.email }}</p>

    <p>
        <a href="{{ url_for('editar', id_usuario=id_usuario) }}">Editar</a> |
        <a href="{{ url_for('listar') }}">Voltar</a>
    </p>
</section>

{% endblock %}
