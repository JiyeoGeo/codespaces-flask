<header>

    <nav>

        <div class="logo">
            Portal Saúde & Bem-Estar
        </div>

        <div class="menu">

            <a href="{{ url_for('index') }}">
                Início
            </a>

            <a href="{{ url_for('about') }}">
                Sobre
            </a>

            {% if session.get('usuario_id') %}

                <a href="{{ url_for('profile') }}">
                    Perfil
                </a>

                <a href="{{ url_for('listar') }}">
                    Usuários
                </a>

                <a href="{{ url_for('logout') }}">
                    Sair ({{ session.get('usuario_nome') }})
                </a>

            {% else %}

                <a href="{{ url_for('login') }}">
                    Login
                </a>

                <a href="{{ url_for('cadastro') }}">
                    Cadastrar
                </a>

            {% endif %}

        </div>

    </nav>

</header>
