{% extends "base.html" %}
{% block title %}Novo usuário{% endblock %}
{% block content %}
<section class="form-card">
    <h1>Cadastrar usuário pelo painel</h1>
    {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="nome">Nome</label><input id="nome" name="nome" required>
        <label for="email">E-mail</label><input id="email" name="email" type="email" required>
        <label for="senha">Senha (mínimo de 8 caracteres)</label><input id="senha" name="senha" type="password" minlength="8" required>
        <label for="funcao">Função</label><select id="funcao" name="funcao"><option value="comum">Comum</option><option value="admin">Administrador</option></select>
        <button type="submit">Criar usuário</button>
    </form>
    <p><a href="{{ url_for('admin_dashboard') }}">Voltar ao painel</a></p>
</section>
{% endblock %}
