{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<section>
    <h1>Login</h1>

    <form method="POST">

        <label for="nome">Nome:</label>
        <input
            type="text"
            id="nome"
            name="nome"
            required
        >

        <label for="email">E-mail:</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <label for="senha">Senha:</label>

        <div class="senha-container">
            <input
                type="password"
                id="senha"
                name="senha"
                required
            >

            <button type="button" onclick="mostrarSenha()">
                👁
            </button>
        </div>

        <p id="caps-lock" style="display: none;">
            Caps Lock ativado
        </p>

        <button type="submit">
            Entrar
        </button>

    </form>
</section>

<script>
function mostrarSenha() {
    const senha = document.getElementById("senha");

    if (senha.type === "password") {
        senha.type = "text";
    } else {
        senha.type = "password";
    }
}

const senha = document.getElementById("senha");
const aviso = document.getElementById("caps-lock");

senha.addEventListener("keydown", verificarCaps);
senha.addEventListener("keyup", verificarCaps);

function verificarCaps(event) {
    aviso.style.display =
        event.getModifierState("CapsLock")
        ? "block"
        : "none";
}
</script>

{% endblock %}
