{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<section>
    <h1>Login</h1>

    <form method="POST">

        <label for="nome">Nome:</label>
        <input
            type="text"
            id="nome"
            name="nome"
            required
        >

        <label for="email">E-mail:</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <label for="senha">Senha:</label>

        <div class="senha-container">
            <input
                type="password"
                id="senha"
                name="senha"
                required
            >

            <button type="button" onclick="mostrarSenha()">
                👁
            </button>
        </div>

        <p id="caps-lock" style="display: none;">
            Caps Lock ativado
        </p>

        <button type="submit">
            Entrar
        </button>

    </form>
</section>

<script src="{{ url_for('static', filename='js/login.js') }}"></script>

{% endblock %}
