{% extends "base.html" %}
{% block title %}Editar usuário{% endblock %}
{% block content %}
<section class="form-card">
    <h1>Atualizar dados do usuário</h1>
    {% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
    <form method="POST" enctype="multipart/form-data">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" value="{{ usuario.nome }}" required>
        <label for="email">Usuário/E-mail</label>
        <input type="email" id="email" name="email" value="{{ usuario.email }}" required>
        <label for="senha">Nova senha (deixe em branco para manter)</label>
        <div class="senha-container">
            <input type="password" id="senha" name="senha" minlength="8" autocomplete="new-password">
            <button type="button" class="botao-olho" data-toggle-password="senha" aria-label="Exibir senha">◉</button>
        </div>
        <label for="foto_perfil">Foto de perfil (opcional)</label>
        <input type="file" id="foto_perfil" name="foto_perfil" accept=".png,.jpg,.jpeg,.webp">
        <button type="submit">Salvar alterações</button>
    </form>
    {% if id_usuario == session.get('user_id') %}
    <form method="POST" action="{{ url_for('excluir_propria_conta') }}" onsubmit="return confirm('Deseja realmente desativar sua conta?')">
        <button type="submit" class="botao-perigo">Desativar minha conta</button>
    </form>
    {% endif %}
    <p><a href="{{ url_for('profile') if id_usuario == session.get('user_id') else url_for('admin_dashboard') }}">Voltar</a></p>
</section>
<script src="{{ url_for('static', filename='JS/login.js') }}" defer></script>
{% endblock %}
