{% extends "base.html" %}
{% block title %}Cadastro{% endblock %}
{% block content %}
<section class="form-card">
    <h1>Criar nova conta</h1>
    {% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" value="{{ nome or '' }}" autocomplete="name" required>
        <label for="email">Usuário/E-mail</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" autocomplete="email" required>
        <label for="senha">Senha (mínimo de 8 caracteres)</label>
        <div class="senha-container">
            <input type="password" id="senha" name="senha" minlength="8" autocomplete="new-password" required>
            <button type="button" class="botao-olho" data-toggle-password="senha" aria-label="Exibir senha">◉</button>
        </div>
        <label for="confirmar_senha">Confirmar senha</label>
        <input type="password" id="confirmar_senha" name="confirmar_senha" minlength="8" required>
        <p id="caps-lock" class="aviso-caps" hidden>Caps Lock ativado</p>
        <label for="funcao">Função</label>
        <select id="funcao" name="funcao">
            <option value="comum" selected>Comum</option>
        </select>
        <small>A função administrativa só pode ser atribuída por um administrador.</small>
        <button type="submit">Cadastrar usuário</button>
    </form>
    <p>Já possui conta? <a href="{{ url_for('login') }}">Entrar</a></p>
</section>
<script src="{{ url_for('static', filename='JS/login.js') }}" defer></script>
{% endblock %}
